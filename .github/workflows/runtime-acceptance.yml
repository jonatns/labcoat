name: Qubitcoin runtime acceptance

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Published runtime-vYYYY.MM.DD.N tag to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.86.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang protobuf-compiler wasi-libc
      - name: Build Labcoat
        run: cargo build --workspace --locked
      - name: Download the three platform runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: |
          mkdir -p "$HOME/.local/share/labcoat/bin"
          gh release download "$RUNTIME_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern qubitcoind-linux-x86_64 \
            --pattern alkanes.wasm \
            --pattern esplorashrew.wasm \
            --dir "$RUNNER_TEMP/runtime"
          cp "$RUNNER_TEMP/runtime/qubitcoind-linux-x86_64" "$HOME/.local/share/labcoat/bin/qubitcoind"
          cp "$RUNNER_TEMP/runtime/alkanes.wasm" "$HOME/.local/share/labcoat/bin/alkanes.wasm"
          cp "$RUNNER_TEMP/runtime/esplorashrew.wasm" "$HOME/.local/share/labcoat/bin/esplorashrew.wasm"
          chmod +x "$HOME/.local/share/labcoat/bin/qubitcoind"
      - name: Boot and verify chain and secondary heights
        run: |
          target/debug/labcoat up --no-download --ci --json
          chain=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' http://127.0.0.1:18443 | jq -r .result)
          alkanes=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"secondaryheight","params":["alkanes"]}' http://127.0.0.1:18443 | jq -r .result)
          esplora=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"secondaryheight","params":["esplora"]}' http://127.0.0.1:18443 | jq -r .result)
          test "$chain" -ge 101
          test "$chain" = "$alkanes"
          test "$chain" = "$esplora"
      - name: Exercise wallet and Counter lifecycle
        run: |
          work=$(mktemp -d)
          cd "$work"
          "$GITHUB_WORKSPACE/target/debug/labcoat" init counter-app --json
          cd counter-app
          wallet=$("$GITHUB_WORKSPACE/target/debug/labcoat" wallet init --json)
          address=$(jq -r .result.address <<<"$wallet")
          "$GITHUB_WORKSPACE/target/debug/labcoat" fund "$address" 1 --json
          "$GITHUB_WORKSPACE/target/debug/labcoat" mine 1 --json
          "$GITHUB_WORKSPACE/target/debug/labcoat" build counter --json
          "$GITHUB_WORKSPACE/target/debug/labcoat" deploy counter --json
          "$GITHUB_WORKSPACE/target/debug/labcoat" simulate counter get_count --json
          call=$("$GITHUB_WORKSPACE/target/debug/labcoat" call counter increment --json)
          txid=$(jq -r '.result.txid // .result.revealTxid' <<<"$call")
          "$GITHUB_WORKSPACE/target/debug/labcoat" trace "$txid" --wait --json
      - name: Exercise operations and recovery
        run: |
          target/debug/labcoat status --json | jq -e '.result.services == [{"id":"qubitcoind","name":"Qubitcoin","status":"running","pid":null,"port":18443,"uptime_secs":null,"version":"0.1.0-stub"}] or (.result.services | length == 1)'
          target/debug/labcoat logs --service qubitcoind --limit 10
          target/debug/labcoat snapshot acceptance --json
          target/debug/labcoat restore acceptance --json
          target/debug/labcoat up --no-download --ci --json
          target/debug/labcoat down --json
          target/debug/labcoat up --no-download --ci --json
          target/debug/labcoat reset -y --json
      - name: Stop on failure
        if: always()
        run: target/debug/labcoat down --json || true
