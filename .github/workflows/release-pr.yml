name: Prepare Labcoat Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next Labcoat version (for example, 0.2.0)
        type: string
        required: true

concurrency:
  group: release-pr-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: Validate release metadata
        run: node scripts/release/validate-release.mjs
      - name: Prepare release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release-plz-$VERSION-$GITHUB_RUN_ID"
          git switch -c "$branch"
          node scripts/release/prepare-release.mjs --version "$VERSION"
          cargo update --workspace
          node scripts/release/validate-release.mjs
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked -p labcoat-cli
          node apps/web/scripts/sync-reference.mjs --bin ./target/debug/labcoat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Cargo.toml \
            Cargo.lock \
            CHANGELOG.md \
            apps/web/src/content/docs/docs/reference/cli.md \
            apps/web/src/generated/cli-reference.json \
            skills/SKILL.md
          git commit -m "chore: release Labcoat v$VERSION"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release Labcoat v$VERSION" \
            --body "Prepare the complete Labcoat v$VERSION product release." \
            --label release
