name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/labcoat-cli/runtime-sources.json'
            web:
              - 'apps/web/**'
              - 'brand.json'
              - 'README.md'
              - 'SECURITY.md'
              - 'CONTRIBUTING.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'docs/BRAND.md'
              - 'scripts/validate-brand.mjs'
              - 'scripts/release/render-release-notes.mjs'
              - 'scripts/tests/release-notes-test.mjs'
              - 'crates/labcoat-cli/src/docs.rs'
              - 'crates/labcoat-cli/src/main.rs'
              - 'crates/labcoat-cli/src/mcp.rs'
              - 'skills/SKILL.md'
              - 'vercel.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang wasi-libc
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - name: Labcoat Network smoke test (protocol stubs)
        run: |
          cargo build --locked -p labcoat-cli
          ./scripts/network-smoke/install-stubs.sh
          trap './target/debug/labcoat down --json || true' EXIT
          ./target/debug/labcoat up --no-download
          for attempt in {1..10}; do
            ./target/debug/labcoat status --json \
              | tee "$RUNNER_TEMP/labcoat-status.json"
            if grep -q '"is_ready": true' "$RUNNER_TEMP/labcoat-status.json"; then
              break
            fi
            sleep 1
          done
          grep -q '"is_ready": true' "$RUNNER_TEMP/labcoat-status.json"
          grep -q '"network": "labcoat"' "$RUNNER_TEMP/labcoat-status.json"
          grep -q '"bitcoin_network": "regtest"' "$RUNNER_TEMP/labcoat-status.json"
          ./target/debug/labcoat fund \
            bcrt1q9zuctyd46l7sdedccdk47335lzsmjz2wngdv3u 1 --json \
            | tee "$RUNNER_TEMP/labcoat-fund.json"
          grep -q '"ok": true' "$RUNNER_TEMP/labcoat-fund.json"
          ./target/debug/labcoat mine 5 --json \
            | tee "$RUNNER_TEMP/labcoat-mine.json"
          grep -q '"ok": true' "$RUNNER_TEMP/labcoat-mine.json"
          ./target/debug/labcoat logs --service qubitcoind --limit 3
          ./target/debug/labcoat down --json \
            | tee "$RUNNER_TEMP/labcoat-down.json"
          grep -q '"ok": true' "$RUNNER_TEMP/labcoat-down.json"
          trap - EXIT
      - name: MCP + agent-surface smoke
        run: |
          ./target/debug/labcoat docs --llm | grep -q "command reference"
          ./target/debug/labcoat docs --json | grep -q '"schema": "labcoat/v1/docs"'
          node apps/web/scripts/sync-reference.mjs --check --bin ./target/debug/labcoat
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' \
            | ./target/debug/labcoat mcp serve | grep -q '"abi_verify"'
      - name: Rust-first project smoke
        env:
          LABCOAT_TEST_CRATE_PATH: ${{ github.workspace }}/crates/labcoat-test
        run: |
          PROJECT_PARENT=$(mktemp -d)
          PROJECT="$PROJECT_PARENT/project"
          cd "$PROJECT_PARENT"
          "$GITHUB_WORKSPACE/target/debug/labcoat" \
            init project --json | grep -q '"ok": true'
          cd "$PROJECT"
          "$GITHUB_WORKSPACE/target/debug/labcoat" \
            new stateful --json | grep -q '"ok": true'
          "$GITHUB_WORKSPACE/target/debug/labcoat" test --json \
            | tee "$RUNNER_TEMP/labcoat-test.json"
          grep -q '"passed": true' "$RUNNER_TEMP/labcoat-test.json"
          test ! -e build/counter.wasm
          "$GITHUB_WORKSPACE/target/debug/labcoat" \
            deploy counter --dry-run --json \
            | tee "$RUNNER_TEMP/labcoat-deploy.json"
          grep -q '"dryRun": true' "$RUNNER_TEMP/labcoat-deploy.json"
          grep -q '"package": "counter"' "$RUNNER_TEMP/labcoat-deploy.json"
          cmp build/counter.abi.json .labcoat/test-artifacts/counter.abi.json
          "$GITHUB_WORKSPACE/target/debug/labcoat" \
            build stateful --json \
            | tee "$RUNNER_TEMP/labcoat-build.json"
          grep -q '"ok": true' "$RUNNER_TEMP/labcoat-build.json"
          "$GITHUB_WORKSPACE/target/debug/labcoat" \
            build contracts/Example.rs --json \
            | tee "$RUNNER_TEMP/labcoat-loose-contract.json"
          grep -q '"code": "CONFIG_INVALID"' "$RUNNER_TEMP/labcoat-loose-contract.json"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @labcoat/web check:og
      - run: pnpm --filter @labcoat/web check
      - run: pnpm --filter @labcoat/web build
      - run: pnpm --filter @labcoat/web exec playwright install --with-deps chromium
      - run: pnpm --filter @labcoat/web test:e2e
      - run: pnpm --filter @labcoat/web test:lighthouse

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: "Guard: diff has no whitespace errors"
        run: git diff --check
      - name: Brand and release governance validation
        run: |
          node scripts/validate-brand.mjs
          node scripts/tests/release-notes-test.mjs
          node scripts/tests/runtime-manifest-test.mjs
      - name: "Guard: no whitespace errors"
        run: |
          if git grep -nI -E '[[:blank:]]+$'; then
            echo '::error::tracked files contain trailing whitespace'
            exit 1
          fi
      - name: Installer unit tests
        run: ./scripts/tests/install-labcoat-test.sh
      - name: Release metadata validation
        run: ./scripts/tests/release-validation-test.sh
      - name: "Guard: oyl-sdk is banned from the npm tree (direct or transitive)"
        run: |
          pnpm install --frozen-lockfile
          if pnpm ls -r --depth Infinity --parseable 2>/dev/null | grep -iE 'oyl[/+-]sdk'; then
            echo '::error::@oyl/sdk found in the resolved npm tree (banned — see TOOLCHAIN.md)'
            exit 1
          fi
          if grep -iE 'oyl[/+-]sdk' pnpm-lock.yaml 2>/dev/null; then
            echo '::error::oyl-sdk reference found in a lockfile (banned — see TOOLCHAIN.md)'
            exit 1
          fi
      - name: "Guard: oyl-sdk is banned from the cargo tree"
        run: |
          if grep -riE 'oyl[_/-]?sdk|"oyl"|/oyl[-.]' Cargo.lock; then
            echo '::error::oyl reference found in Cargo.lock (banned — see TOOLCHAIN.md)'
            exit 1
          fi
      - name: "Guard: every alkanes-rs reference is pinned to the TOOLCHAIN.md rev on main"
        run: |
          PIN=$(grep -oE '\*\*Pinned commit\*\* \| `[0-9a-f]{40}`' TOOLCHAIN.md | grep -oE '[0-9a-f]{40}')
          echo "Pinned rev: $PIN"
          test -n "$PIN" || { echo '::error::could not read pin from TOOLCHAIN.md'; exit 1; }
          # 1) No unpinned/branch refs to alkanes-rs anywhere in the tree
          #    (Cargo git deps must use rev=, workflows must use the SHA).
          BAD=$(grep -rn --include='*.toml' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.ts' 'alkanes-rs' \
                 | grep -vE "$PIN" \
                 | grep -viE 'toolchain\.md|docs/|branch of record' \
                 | grep -iE 'branch *= *"|ref: *(main|develop)$|alkanes-rs(\.git)?" *\}' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo '::error::alkanes-rs referenced without the pinned rev (see TOOLCHAIN.md)'
            exit 1
          fi
          # 2) The pin itself must be reachable from main.
          git clone --bare --filter=blob:none https://github.com/kungfuflex/alkanes-rs /tmp/alkanes-rs-check
          cd /tmp/alkanes-rs-check
          git merge-base --is-ancestor "$PIN" refs/heads/main \
            || { echo '::error::pinned rev is not reachable from alkanes-rs main'; exit 1; }
