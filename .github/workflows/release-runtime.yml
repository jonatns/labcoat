name: Build and release Qubitcoin runtime

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package without publishing or opening a promotion PR
        type: boolean
        default: true
        required: true

concurrency:
  group: release-runtime
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Qubitcoin's pinned lockfile follows Metashrew develop past the API it implements.
  QUBITCOIN_METASHREW_REV: 22824e4ce8812751bd85b4dfff0da66b4ee025df

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
      source_digest: ${{ steps.metadata.outputs.source_digest }}
      publish: ${{ steps.metadata.outputs.publish }}
      qubitcoin_repo: ${{ steps.metadata.outputs.qubitcoin_repo }}
      qubitcoin_ref: ${{ steps.metadata.outputs.qubitcoin_ref }}
      alkanes_repo: ${{ steps.metadata.outputs.alkanes_repo }}
      alkanes_ref: ${{ steps.metadata.outputs.alkanes_ref }}
      esplorashrew_repo: ${{ steps.metadata.outputs.esplorashrew_repo }}
      esplorashrew_ref: ${{ steps.metadata.outputs.esplorashrew_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node scripts/release/validate-release.mjs
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "runtime releases must be published from main" >&2
            exit 1
          fi
          date_part=$(date -u +%Y.%m.%d)
          last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/runtime-v$date_part" \
            --jq '.[].ref' 2>/dev/null | sed -n 's#.*\.##p' | sort -n | tail -n 1)
          sequence=$(( ${last:-0} + 1 ))
          tag="runtime-v$date_part.$sequence"
          node scripts/release/validate-release.mjs --validate-runtime-tag "$tag"
          publish=true
          [ "$DRY_RUN" = true ] && publish=false
          qubitcoin_repo=$(jq -er '.sources.qubitcoin.repository | select(type == "string" and length > 0)' runtime.json)
          qubitcoin_ref=$(jq -er '.sources.qubitcoin.revision | select(type == "string" and length > 0)' runtime.json)
          alkanes_repo=$(jq -er '.sources["alkanes-wasm"].repository | select(type == "string" and length > 0)' runtime.json)
          alkanes_ref=$(jq -er '.sources["alkanes-wasm"].revision | select(type == "string" and length > 0)' runtime.json)
          esplorashrew_repo=$(jq -er '.sources["esplorashrew-wasm"].repository | select(type == "string" and length > 0)' runtime.json)
          esplorashrew_ref=$(jq -er '.sources["esplorashrew-wasm"].revision | select(type == "string" and length > 0)' runtime.json)
          {
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "source_digest=$(node scripts/release/validate-release.mjs --runtime-source-digest)"
            echo "publish=$publish"
            echo "qubitcoin_repo=$qubitcoin_repo"
            echo "qubitcoin_ref=$qubitcoin_ref"
            echo "alkanes_repo=$alkanes_repo"
            echo "alkanes_ref=$alkanes_ref"
            echo "esplorashrew_repo=$esplorashrew_repo"
            echo "esplorashrew_ref=$esplorashrew_ref"
          } >> "$GITHUB_OUTPUT"

  build-qubitcoind:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: darwin-arm64
          - runner: ubuntu-latest
            suffix: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.metadata.outputs.qubitcoin_repo }}
          ref: ${{ needs.metadata.outputs.qubitcoin_ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protobuf compiler
        run: ${{ runner.os == 'macOS' && 'brew install protobuf' || 'sudo apt-get update && sudo apt-get install -y clang protobuf-compiler' }}
      - name: Pin Qubitcoin-compatible Metashrew
        run: cargo update -p metashrew-runtime --precise "$QUBITCOIN_METASHREW_REV"
      - run: cargo build --locked --release -p qubitcoind
      - run: cp target/release/qubitcoind qubitcoind-${{ matrix.suffix }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qubitcoind-${{ matrix.suffix }}
          path: qubitcoind-${{ matrix.suffix }}

  build-alkanes-wasm:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.metadata.outputs.alkanes_repo }}
          ref: ${{ needs.metadata.outputs.alkanes_ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: sudo apt-get update && sudo apt-get install -y clang protobuf-compiler
      - run: |
          cargo build --locked --release --target wasm32-unknown-unknown --features regtest -p alkanes
          cp target/wasm32-unknown-unknown/release/alkanes.wasm alkanes.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alkanes-wasm
          path: alkanes.wasm

  build-esplorashrew-wasm:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.metadata.outputs.esplorashrew_repo }}
          ref: ${{ needs.metadata.outputs.esplorashrew_ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/esplorashrew.wasm esplorashrew.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esplorashrew-wasm
          path: esplorashrew.wasm

  assemble:
    needs: [metadata, build-qubitcoind, build-alkanes-wasm, build-esplorashrew-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Build release manifest and checksums
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_DIGEST: ${{ needs.metadata.outputs.source_digest }}
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 4
          for file in qubitcoind-darwin-arm64 qubitcoind-linux-x86_64 alkanes.wasm esplorashrew.wasm; do
            test -f "release/$file"
          done
          checksums='{}'
          for file in release/*; do
            name=$(basename "$file")
            hash=$(sha256sum "$file" | awk '{print $1}')
            checksums=$(jq --arg name "$name" --arg hash "$hash" '. + {($name): $hash}' <<<"$checksums")
          done
          jq -S . <<<"$checksums" > release/checksums.json
          jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg digest "$SOURCE_DIGEST" \
            --slurpfile config runtime.json --slurpfile checksums release/checksums.json \
            '{schema: 2, tag: $tag, commit: $sha, source_digest: $digest, sources: $config[0].sources, checksums: $checksums[0]}' \
            > release/runtime-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-release-${{ needs.metadata.outputs.tag }}
          path: release/*
          if-no-files-found: error

  publish:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, assemble]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-release-${{ needs.metadata.outputs.tag }}
          path: release
      - name: Recheck source pins
        env:
          SOURCE_DIGEST: ${{ needs.metadata.outputs.source_digest }}
        run: node scripts/release/validate-release.mjs --expect-runtime-source-digest "$SOURCE_DIGEST"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          gh release create "$TAG" --target "$SHA" --title "Labcoat runtime $TAG" \
            --notes "Pinned Qubitcoin runtime assets for Labcoat." release/*
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*
      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          branch="runtime-promotion/$TAG"
          jq --arg tag "$TAG" \
            '.active_release = {owner: "jonatns", repository: "labcoat", tag: $tag, checksums_asset: "checksums.json"}' \
            runtime.json > runtime.json.new
          mv runtime.json.new runtime.json
          node scripts/release/validate-release.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add runtime.json
          git commit -m "chore: promote runtime $TAG"
          git push -u origin "$branch"
          gh label create runtime-promotion --color 1d76db --description "Promotes a verified runtime bundle" --force
          gh pr create --base main --head "$branch" --title "chore: promote runtime $TAG" \
            --label runtime-promotion --body "Promotes the verified runtime bundle \`$TAG\`."
