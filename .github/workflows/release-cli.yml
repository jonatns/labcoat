name: Release Labcoat

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate the complete release without publishing
        type: boolean
        default: true
        required: true

concurrency:
  group: release-labcoat-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      publish: ${{ steps.release.outputs.publish }}
      qubitcoin_repo: ${{ steps.release.outputs.qubitcoin_repo }}
      qubitcoin_ref: ${{ steps.release.outputs.qubitcoin_ref }}
      alkanes_repo: ${{ steps.release.outputs.alkanes_repo }}
      alkanes_ref: ${{ steps.release.outputs.alkanes_ref }}
      esplorashrew_repo: ${{ steps.release.outputs.esplorashrew_repo }}
      esplorashrew_ref: ${{ steps.release.outputs.esplorashrew_ref }}
      qubitcoin_metashrew_ref: ${{ steps.release.outputs.qubitcoin_metashrew_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - id: release
        name: Validate complete release target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/validate-release.mjs
          version=$(node scripts/release/validate-release.mjs --workspace-version)
          tag="cli-v$version"
          node scripts/release/render-release-notes.mjs \
            --version "$version" \
            --tag "$tag" \
            --output "$RUNNER_TEMP/release-notes.md"
          sha=$(git rev-parse HEAD)
          publish=true
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$DRY_RUN" != true ]; then
              echo "manual runs are validation-only; merge a prepared release PR to publish" >&2
              exit 1
            fi
            publish=false
          fi
          if [ -n "$MERGE_SHA" ] && [ "$sha" != "$MERGE_SHA" ]; then
            echo "checked out $sha, expected merge SHA $MERGE_SHA" >&2
            exit 1
          fi
          if [ "$publish" = true ]; then
            remote=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')
            if [ -n "$remote" ] && [ "$remote" != "$sha" ]; then
              echo "$tag already points to $remote, not $sha" >&2
              exit 1
            fi
          fi
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
          sources=crates/labcoat-cli/runtime-sources.json
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "publish=$publish"
            echo "qubitcoin_repo=$(jq -er '.sources.qubitcoin.repository' "$sources")"
            echo "qubitcoin_ref=$(jq -er '.sources.qubitcoin.revision' "$sources")"
            echo "alkanes_repo=$(jq -er '.sources["alkanes-wasm"].repository' "$sources")"
            echo "alkanes_ref=$(jq -er '.sources["alkanes-wasm"].revision' "$sources")"
            echo "esplorashrew_repo=$(jq -er '.sources["esplorashrew-wasm"].repository' "$sources")"
            echo "esplorashrew_ref=$(jq -er '.sources["esplorashrew-wasm"].revision' "$sources")"
            echo "qubitcoin_metashrew_ref=$(jq -er '.compatibility.qubitcoin_metashrew_revision' "$sources")"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify CLI version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release -p labcoat-cli --target "$TARGET"
          output=$("target/$TARGET/release/labcoat" --version)
          test "$output" = "labcoat $VERSION"
      - name: Package CLI with checksum
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/labcoat" "dist/labcoat-$SUFFIX"
          if command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "labcoat-$SUFFIX" > "labcoat-$SUFFIX.sha256")
          else
            (cd dist && sha256sum "labcoat-$SUFFIX" > "labcoat-$SUFFIX.sha256")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  build-qubitcoind:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: darwin-arm64
          - runner: ubuntu-latest
            suffix: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.metadata.outputs.qubitcoin_repo }}
          ref: ${{ needs.metadata.outputs.qubitcoin_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: ${{ runner.os == 'macOS' && 'brew install protobuf' || 'sudo apt-get update && sudo apt-get install -y clang protobuf-compiler' }}
      - name: Pin Qubitcoin-compatible Metashrew
        env:
          METASHREW_REV: ${{ needs.metadata.outputs.qubitcoin_metashrew_ref }}
        run: cargo update -p metashrew-runtime --precise "$METASHREW_REV"
      - run: cargo build --locked --release -p qubitcoind
      - run: cp target/release/qubitcoind qubitcoind-${{ matrix.suffix }}
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-qubitcoind-${{ matrix.suffix }}
          path: qubitcoind-${{ matrix.suffix }}
          if-no-files-found: error

  build-alkanes-wasm:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.metadata.outputs.alkanes_repo }}
          ref: ${{ needs.metadata.outputs.alkanes_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang protobuf-compiler
      - run: cargo build --locked --release --target wasm32-unknown-unknown --features regtest -p alkanes
      - run: cp target/wasm32-unknown-unknown/release/alkanes.wasm alkanes.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-alkanes-wasm
          path: alkanes.wasm
          if-no-files-found: error

  build-esplorashrew-wasm:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.metadata.outputs.esplorashrew_repo }}
          ref: ${{ needs.metadata.outputs.esplorashrew_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build Esplorashrew WASM
        env:
          RUSTFLAGS: "-C link-arg=--allow-undefined"
        run: cargo build --release --target wasm32-unknown-unknown
      - run: cp target/wasm32-unknown-unknown/release/esplorashrew.wasm esplorashrew.wasm
      - name: Verify Metashrew host imports
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const wasm = new WebAssembly.Module(fs.readFileSync('esplorashrew.wasm'));
          const actual = WebAssembly.Module.imports(wasm)
            .map(({ module, name, kind }) => `${module}:${name}:${kind}`)
            .sort();
          const expected = [
            'env:__flush:function',
            'env:__get:function',
            'env:__get_len:function',
            'env:__host_len:function',
            'env:__load_input:function',
            'env:__log:function',
          ].sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`unexpected Esplorashrew imports: ${actual.join(', ')}`);
          }
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-esplorashrew-wasm
          path: esplorashrew.wasm
          if-no-files-found: error

  assemble:
    needs:
      - metadata
      - build-cli
      - build-qubitcoind
      - build-alkanes-wasm
      - build-esplorashrew-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify and describe the complete product release
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 12
          for suffix in darwin-arm64 darwin-x86_64 linux-arm64 linux-x86_64; do
            test -f "dist/labcoat-$suffix"
            test -f "dist/labcoat-$suffix.sha256"
            (cd dist && sha256sum -c "labcoat-$suffix.sha256")
          done
          for file in qubitcoind-darwin-arm64 qubitcoind-linux-x86_64 alkanes.wasm esplorashrew.wasm; do
            test -f "dist/$file"
          done
          node scripts/release/build-runtime-manifest.mjs \
            --version "$VERSION" \
            --directory dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 13
      - uses: actions/upload-artifact@v7
        with:
          name: labcoat-release-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  runtime-acceptance:
    needs: [metadata, assemble]
    runs-on: ubuntu-latest
    env:
      LABCOAT_TEST_CRATE_PATH: ${{ github.workspace }}/crates/labcoat-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - name: Configure runtime acceptance paths
        run: echo "LABCOAT_DATA_HOME=$RUNNER_TEMP/labcoat-data" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: labcoat-release-${{ needs.metadata.outputs.version }}
          path: dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang protobuf-compiler wasi-libc
      - name: Install the exact local release bundle
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          bundle="$LABCOAT_DATA_HOME/labcoat/runtimes/$TAG"
          mkdir -p "$bundle"
          cp dist/runtime-manifest.json dist/alkanes.wasm dist/esplorashrew.wasm "$bundle/"
          cp dist/qubitcoind-linux-x86_64 "$bundle/qubitcoind"
          chmod +x "$bundle/qubitcoind" dist/labcoat-linux-x86_64
      - name: Boot and verify the complete runtime
        run: |
          trap 'dist/labcoat-linux-x86_64 down --json || true' EXIT
          dist/labcoat-linux-x86_64 binaries --json | grep -q '"installed"'
          dist/labcoat-linux-x86_64 up --no-download --ci --json
          chain=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' http://127.0.0.1:18443 | jq -r .result)
          alkanes=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"secondaryheight","params":["alkanes"]}' http://127.0.0.1:18443 | jq -r .result)
          esplora=$(curl -fsS --data-binary '{"jsonrpc":"2.0","id":1,"method":"secondaryheight","params":["esplora"]}' http://127.0.0.1:18443 | jq -r .result)
          test "$chain" -ge 101
          test "$chain" = "$alkanes"
          test "$chain" = "$esplora"
          work=$(mktemp -d)
          cd "$work"
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" init counter-app --json
          cd counter-app
          wallet=$("$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" wallet init --json)
          address=$(jq -r .result.address <<<"$wallet")
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" fund "$address" 1 --json
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" mine 1 --json
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" test --json
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" deploy counter --json
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" simulate counter get_count --json
          call=$("$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" call counter increment --json)
          txid=$(jq -r '.result.txid // .result.revealTxid' <<<"$call")
          "$GITHUB_WORKSPACE/dist/labcoat-linux-x86_64" trace "$txid" --wait --json
          cd "$GITHUB_WORKSPACE"
          dist/labcoat-linux-x86_64 down --json
          trap - EXIT

  publish:
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, assemble, runtime-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: labcoat-release-${{ needs.metadata.outputs.version }}
          path: dist
      - name: Create or validate the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node scripts/release/render-release-notes.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --output "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
            existing=$(jq -r '.object.sha' <<<"$object")
            if [ "$(jq -r '.object.type' <<<"$object")" = tag ]; then
              existing=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq .object.sha)
            fi
            test "$existing" = "$SHA"
          else
            gh release create "$TAG" --draft --target "$SHA" --title "Labcoat $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" dist/* --clobber
          fi
      - name: Attest all Labcoat artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish and verify the product release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          fi
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 13
          test "$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          tmp=$(mktemp -d)
          LABCOAT_REPO="$GITHUB_REPOSITORY" LABCOAT_INSTALL_DIR="$tmp/bin" \
            sh install-labcoat.sh --version "$VERSION"
          "$tmp/bin/labcoat" --version | grep -F "labcoat $VERSION"
          "$tmp/bin/labcoat" --help | grep -F "new"
          "$tmp/bin/labcoat" --help | grep -F "build"
          cd "$tmp"
          "$tmp/bin/labcoat" init release-smoke --json
          grep -F "git = \"https://github.com/jonatns/labcoat\"" release-smoke/Cargo.toml
          grep -F "tag = \"cli-v$VERSION\"" release-smoke/Cargo.toml
