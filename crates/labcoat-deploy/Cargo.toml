[package]
name = "labcoat-deploy"
version.workspace = true
publish = false
description = "Rust deployment scripts for Labcoat Alkanes projects"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true

# The deployment scripts shipped as documentation and as the project
# template, built with the deployment crate so they cannot drift from its API.
[[example]]
name = "starter-deploy"
path = "../labcoat-cli/templates/default/deploy.rs"

[[example]]
name = "covered-call-deploy"
path = "../../docs/examples/covered-call/deploy.rs"

[[example]]
name = "upgradeable-counter-deploy"
path = "../../docs/examples/upgradeable-counter/deploy.rs"
