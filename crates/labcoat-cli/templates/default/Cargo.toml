[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
# Keep these revisions synchronized with the Labcoat release and TOOLCHAIN.md.
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "714843c416e2ab57352a33f05b8461cf3f540f5a" }
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "714843c416e2ab57352a33f05b8461cf3f540f5a" }
metashrew-support = { git = "https://github.com/kungfuflex/metashrew", tag = "v9.0.5-rc.8" }
anyhow = "1.0"

# Direct contract dependencies pin transitive releases to Rust 1.86-compatible versions.
serde_with = { version = "=3.16.1", default-features = false }
time = { version = "=0.3.44", default-features = false }

[dev-dependencies]
labcoat-test = { git = "https://github.com/jonatns/labcoat", tag = "cli-v{{LABCOAT_VERSION}}" }
