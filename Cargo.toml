[workspace]
resolver = "2"
members = [
    "crates/isomer-core",
    "crates/labcoat-core",
    "crates/labcoat-cli",
    "crates/labcoat-test",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jonatns/labcoat"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
toml = "0.8"
wasmi = "=0.37.2"
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"

# Hard constraint (see TOOLCHAIN.md): every alkanes-rs dependency is pinned
# to a commit on the *main* branch — never a moving branch ref.
alkanes-support = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "714843c416e2ab57352a33f05b8461cf3f540f5a" }
# NOTE: alkanes-cli-sys is NOT used — at the pinned rev it fails to compile
# (its EnhancedExecuteParams initializer is missing fields added 2026-07-12).
# labcoat-core bootstraps ConcreteProvider from alkanes-cli-common directly.
# native-deps is REQUIRED: upstream cfg-gates its whole HTTP client on it
# (without it every RPC method returns "not available in WASM environment").
alkanes-cli-common = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "714843c416e2ab57352a33f05b8461cf3f540f5a", default-features = false, features = ["std", "native-deps"] }
ordinals = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "714843c416e2ab57352a33f05b8461cf3f540f5a" }

# NOTE on transitive git deps: alkanes-rs declares metashrew by tag and emasm
# by a moving branch ref. Cargo forbids [patch]-ing a git source with itself at a rev,
# so the reproducibility pin is the committed Cargo.lock (which records the
# exact commits, e.g. metashrew@22824e4c) enforced by `--locked` in CI.
# Never run a bare `cargo update` — see TOOLCHAIN.md upgrade procedure.
